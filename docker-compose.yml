services:
  cptea:
    build: .
    image: cptea:1.0
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - cptea-data:/data
      # Optional: mount a track archive read-only and load it with "folder path on the server" = /archive
      # - /srv/adsb/Flights:/archive:ro
volumes:
  cptea-data:
